name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  push:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab on GitHub
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      - name: Install, build, and upload your site
        uses: withastro/action@v3
      # SEO / truthfulness lint (titles, metas, JSON-LD, visible-FAQ rule,
      # banned claims, broken links). Fails the deploy if the site breaks a house rule.
      - name: SEO check
        run: node scripts/seo-check.mjs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Tell Bing (and so Copilot / ChatGPT search, which draw on Bing's index),
  # Yandex, Seznam and Naver that URLs changed. Never fails the workflow.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Ping IndexNow with every sitemap URL
        run: node scripts/indexnow.mjs
