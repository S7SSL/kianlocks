<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Navy background -->
  <rect width="64" height="64" rx="12" fill="#0E1A3A"/>
  <!-- Gold key, centered, large enough to read at 16x16 -->
  <g fill="none" stroke="#D4AF37" stroke-linecap="round" stroke-linejoin="round">
    <!-- Key bow (bigger, centered) -->
    <circle cx="22" cy="32" r="9" stroke-width="4"/>
    <!-- Inner notch hole in bow -->
    <circle cx="22" cy="32" r="2.5" fill="#0E1A3A" stroke="none"/>
  </g>
  <!-- Key shaft and teeth -->
  <g fill="#D4AF37">
    <rect x="31" y="29.5" width="22" height="5" rx="1"/>
    <rect x="44" y="34.5" width="4" height="6" rx="1"/>
    <rect x="49" y="34.5" width="4" height="5" rx="1"/>
  </g>
</svg>
